name: Sincronizar Blogger

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # 06:00 em America/Sao_Paulo (UTC-3)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sincronizar posts
        run: node scripts/sync-blogger.mjs
      - name: Publicar atualização somente quando houver mudança
        run: |
          if git diff --quiet -- data/blogger-posts.json; then
            echo "Nenhuma mudança no Blogger."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blogger-posts.json
          git commit -m "content: sincronizar artigos do Blogger"
          git push
